  <style>
    :root {
      --bg: #10070d;
      --panel: #1b0c16;
      --pink: #ff4f9a;
      --pink-light: #ffc1dc;
      --gold: #d9b56d;
      --text: #fff5fa;
      --muted: #c5aeba;
      --line: #603047;
      --radius: 18px;
      --shadow: 0 15px 55px #0008;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Montserrat", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    img { max-width: 100%; display: block; }

    /* ========== LAYOUT ========== */
    .wrap {
      width: min(1120px, 92%);
      margin: 0 auto;
    }

    /* ========== HEADER ========== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(16, 7, 13, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #2a1520;
      padding: 14px 0;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 0 20px #ff4f9a40, 0 0 0 2px #d9b56d66;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .brand-logo:hover {
      transform: scale(1.06);
      box-shadow: 0 0 28px #ff4f9a55, 0 0 0 2px #d9b56d99;
    }

    .brand-name {
      font-family: "Cormorant Garamond", serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.2px;
      line-height: 1.1;
    }

    .brand-name span { color: var(--pink-light); }

    .brand-sub {
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
      transition: color var(--transition);
      position: relative;
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0;
      height: 1px;
      background: var(--pink-light);
      transition: width var(--transition);
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--pink-light);
    }

    nav a:hover::after,
    nav a:focus-visible::after {
      width: 100%;
    }

    .status {
      font-size: 10px;
      color: var(--pink-light);
      letter-spacing: 1.4px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 10px var(--pink);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    /* ========== HERO ========== */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 48px;
      margin: 58px auto 40px;
      max-width: 1050px;
    }

    .hero-copy h1 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(36px, 5vw, 52px);
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .hero-copy h1 span {
      color: var(--pink-light);
      font-style: italic;
    }

    .hero-copy p {
      color: var(--muted);
      font-size: 15px;
      max-width: 420px;
      margin-bottom: 28px;
    }

    .hero-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 26px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
      transition: all var(--transition);
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--pink), #e83a7a);
      color: #fff;
      box-shadow: 0 8px 28px #ff4f9a55;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 36px #ff4f9a77;
    }

    .btn.secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--pink-light);
      box-shadow: none;
    }

    .btn.secondary:hover {
      border-color: var(--pink-light);
      background: #ff4f9a15;
    }

    .btn.buy {
      background: linear-gradient(135deg, #25d366, #128c7e);
      box-shadow: 0 8px 28px #25d36655;
    }

    .btn.buy:hover {
      box-shadow: 0 12px 36px #25d36677;
    }

    /* Floating WhatsApp */
    .float-wa {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #25d366;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 24px #25d36666;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .float-wa:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 32px #25d36688;
    }

    .float-wa svg {
      width: 32px;
      height: 32px;
      fill: #fff;
    }

    .hero-visual {
      position: relative;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      aspect-ratio: 3/4;
      max-height: 520px;
    }

    .hero-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .hero-badge {
      position: absolute;
      bottom: 18px;
      left: 18px;
      background: rgba(16, 7, 13, 0.85);
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 12px;
      border: 1px solid #d9b56d44;
    }

    .hero-badge strong {
      color: var(--gold);
      display: block;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    /* ========== SECTIONS ========== */
    .section {
      padding: 60px 0 20px;
    }

    .section-kicker {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .section h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .section-intro {
      color: var(--muted);
      max-width: 560px;
      font-size: 15px;
      margin-bottom: 36px;
    }

    /* ABOUT */
    .about {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 48px;
      align-items: center;
      background: var(--panel);
      border-radius: var(--radius);
      padding: 40px;
      border: 1px solid #2a1520;
    }

    .about-photo {
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 3/4;
      box-shadow: 0 12px 40px #0006;
    }

    .about-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    .about-copy p {
      color: var(--muted);
      margin-bottom: 16px;
      font-size: 15px;
    }

    .about-copy strong {
      color: var(--pink-light);
    }

    /* PILLARS */
    .pillars {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 10px;
    }

    .pillar {
      background: var(--panel);
      border: 1px solid #2a1520;
      border-radius: var(--radius);
      padding: 28px 22px;
      transition: transform var(--transition), border-color var(--transition);
    }

    .pillar:hover {
      transform: translateY(-4px);
      border-color: #ff4f9a55;
    }

    .pillar b {
      display: block;
      font-family: "Cormorant Garamond", serif;
      font-size: 22px;
      margin-bottom: 10px;
      color: var(--pink-light);
    }

    .pillar span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    /* PRODUTOS */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 10px;
    }

    .product-card {
      background: var(--panel);
      border: 1px solid #2a1520;
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform var(--transition), border-color var(--transition);
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: #ff4f9a55;
    }

    .product-img {
      aspect-ratio: 3/4;
      overflow: hidden;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.4s ease;
    }

    .product-card:hover .product-img img {
      transform: scale(1.05);
    }

    .product-info {
      padding: 18px 16px 20px;
      text-align: center;
    }

    .product-info h3 {
      font-family: "Cormorant Garamond", serif;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--pink-light);
    }

    .product-info p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .product-info .btn {
      padding: 11px 20px;
      font-size: 12px;
      width: 100%;
    }

    /* FORM */
    .form-section {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 48px 40px;
      border: 1px solid #2a1520;
      margin: 40px 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 28px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 500;
      color: var(--pink-light);
      letter-spacing: 0.3px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      background: #140910;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      transition: border-color var(--transition);
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--pink);
    }

    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 8px;
    }

    .form-note {
      grid-column: 1 / -1;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* CONTACT */
    .contact {
      text-align: center;
      padding: 50px 0 30px;
    }

    .contact p {
      color: var(--muted);
      margin-bottom: 10px;
    }

    .contact .location {
      color: var(--gold);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .cta-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    /* FOOTER */
    footer {
      border-top: 1px solid #2a1520;
      padding: 32px 0 40px;
      text-align: center;
      margin-top: 40px;
    }

    footer p {
      color: var
