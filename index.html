<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanessa Duran | Moda & Estilo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --ouro-claro: #FFD700;
            --ouro-medio: #E6B800;
            --ouro-escuro: #B8860B;
            --ouro-brilhante: #FFF8B8;
            --preto-fundo: #020202;
            --preto-card: #0F0F0F;
            --preto-claro: #1A1A1A;
            --texto-claro: #F8F8F8;
            --texto-suave: #C9C2A3;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--preto-fundo);
            color: var(--texto-claro);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* Efeitos de fundo */
        .bg-glow-1, .bg-glow-2 {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.08), transparent 70%);
            filter: blur(90px);
            z-index: -1;
            pointer-events: none;
        }
        .bg-glow-1 { top: -150px; right: -100px; width: 600px; height: 600px; }
        .bg-glow-2 { bottom: -150px; left: -100px; width: 500px; height: 500px; }

        .bg-grade {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 215, 0, 0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.018) 1px, transparent 1px);
            background-size: 70px 70px;
            z-index: -2;
            pointer-events: none;
        }

        /* Navegação */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2, 2, 2, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.08);
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--ouro-brilhante), var(--ouro-claro), var(--ouro-medio));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 3px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--ouro-claro), var(--ouro-medio));
            transition: width 0.4s ease;
        }

        .nav-links a:hover {
            color: var(--ouro-claro);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .menu-btn {
            display: none;
            font-size: 1.8rem;
            color: var(--ouro-claro);
            cursor: pointer;
        }

        /* Seção Hero */
        section.hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 140px 20px 80px;
        }

        .hero-conteudo {
            max-width: 850px;
        }

        .foto-perfil-container {
            width: 200px;
            height: 200px;
            margin: 0 auto 35px;
            border-radius: 50%;
            border: 4px solid transparent;
            background: linear-gradient(var(--preto-fundo), var(--preto-fundo)) padding-box,
                        linear-gradient(135deg, var(--ouro-brilhante), var(--ouro-claro), var(--ouro-medio), var(--ouro-escuro)) border-box;
            overflow: hidden;
            box-shadow: 
                0 0 50px rgba(255, 215, 0, 0.18),
                0 20px 50px rgba(0, 0, 0, 0.6);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .foto-perfil-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .foto-perfil-container:hover {
            transform: perspective(600px) rotateY(10deg) scale(1.06);
            box-shadow: 
                0 0 80px rgba(255, 215, 0, 0.28),
                0 25px 60px rgba(0, 0, 0, 0.7);
        }

        h1 {
            font-size: clamp(2.8rem, 7vw, 4.8rem);
            background: linear-gradient(
                180deg,
                var(--ouro-brilhante) 0%,
                var(--ouro-claro) 35%,
                var(--ouro-medio) 70%,
                var(--ouro-escuro) 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .subtitulo {
            font-size: 1.25rem;
            color: var(--texto-suave);
            margin-bottom: 45px;
            letter-spacing: 2px;
        }

        .botoes-hero {
            display: flex;
            gap: 22px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 45px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.4s ease;
            border: none;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .btn-dourado {
            background: linear-gradient(135deg, var(--ouro-claro), var(--ouro-medio));
            color: #000;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.18);
        }

        .btn-dourado:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 40px rgba(255, 215, 0, 0.25);
            filter: brightness(1.08);
        }

        .btn-transparente {
            background: transparent;
            color: var(--ouro-claro);
            border: 1px solid var(--ouro-claro);
        }

        .btn-transparente:hover {
            background: rgba(255, 215, 0, 0.06);
            transform: translateY(-4px);
        }

        /* Seções gerais */
        section {
            padding: 90px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .secao-titulo {
            text-align: center;
            font-size: 2rem;
            color: var(--ouro-claro);
            margin-bottom: 60px;
            letter-spacing: 4px;
            position: relative;
        }

        .secao-titulo::after {
            content: '';
            display: block;
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--ouro-claro), transparent);
            margin: 18px auto 0;
        }

        /* Sobre */
        .sobre-conteudo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .sobre-texto h3 {
            font-size: 1.5rem;
            color: var(--ouro-brilhante);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .sobre-texto p {
            color: var(--texto-suave);
            margin-bottom: 18px;
            font-size: 1.02rem;
        }

        .sobre-imagem {
            aspect-ratio: 4/5;
            background: var(--preto-card);
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
        }

        .sobre-imagem img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sobre-imagem:hover {
            transform: perspective(800px) rotateY(-4deg);
            border-color: var(--ouro-claro);
        }

        /* Serviços */
        .servicos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .servico-card {
            background: linear-gradient(145deg, #141208, #0C0B06);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            transition: all 0.4s ease;
        }

        .servico-card:hover {
            transform: translateY(-12px);
            border-color: rgba(255, 215, 0, 0.25);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 30px rgba(255, 215, 0, 0.04);
        }

        .servico-icone {
            font-size: 2.8rem;
            margin-bottom: 22px;
        }

        .servico-card h3 {
            color: var(--ouro-claro);
            font-size: 1.2rem;
            margin-bottom: 14px;
        }

        .servico-card p {
            color: #8F8660;
            font-size: 0.96rem;
            line-height: 1.7;
        }

        /* Galeria */
        .galeria-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .galeria-item {
            aspect-ratio: 1 / 1;
            background: var(--preto-card);
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #554C20;
            transition: all 0.4s ease;
            overflow: hidden;
            position: relative;
        }

        .galeria-item span {
            font-size: 2.2rem;
            opacity: 0.3;
        }

        .galeria-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent, rgba(255, 215, 0, 0.03));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .galeria-item:hover {
            border-color: rgba(255, 215, 0, 0.2);
            transform: scale(1.04);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .galeria-item:hover::after {
            opacity: 1;
        }

        /* Contato */
        .contato-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .contato-card {
            background: linear-gradient(145deg, #141208, #0C0B06);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            text-decoration: none;
            transition: all 0.4s ease;
            display: block;
        }

        .contato-card:hover {
            transform: translateY(-10px);
            border-color: var(--ouro-claro);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45), 0 0 25px rgba(255, 215, 0, 0.05);
        }

        .contato-icone {
            font-size: 2.4rem;
            margin-bottom: 18px;
        }

        .contato-card h3 {
            color: var(--ouro-claro);
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .contato-card p {
            color: #8F8660;
            font-size: 0.92rem;
        }

        /* Rodapé */
        footer {
            background: var(--preto-card);
            border-top: 1px solid rgba(255, 215, 0, 0.08);
            padding: 60px 20px 30px;
            text-align: center;
            margin-top: 40px;
        }

        footer h2 {
            font-size: 1.6rem;
            color: var(--ouro-claro);
            margin-bottom: 15px;
        }

        footer p {
            color: #777;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .footer-links {
            margin: 30px 0;
        }

        .footer-links a {
            color: #8F8660;
            margin: 0 18px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--ouro-claro);
        }

        .copyright {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 215, 0, 0.05);
            color: #444;
            font-size: 0.85rem;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            nav { padding: 15px 20px; }
            .nav-links { display: none; }
            .menu-btn { display: block; }
            .sobre-conteudo { grid-template-columns: 1fr; gap: 40px; }
            .galeria-grid { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 2.2rem; }
            section { padding: 70px 15px; }
            .foto-perfil-container { width: 160px; height: 160px; }
        }
    </style>
</head>
<body>
    <!-- Fundos -->
    <div class="bg-grade"></div>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- Navegação -->
    <nav>
        <div class="logo">VANESSA DURAN</div>
        <ul class="nav-links">
            <li><a href="#inicio">Início</a></li>
            <li><a href="#sobre">Sobre</a></li>
            <li><a href="#trabalhos">Trabalhos</a></li>
            <li><a href="#contato">Contato</a></li>
        </ul>
        <div class="menu-btn">☰</div>
    </nav>

    <!-- Início / Hero -->
    <section class="hero" id="inicio">
        <div class="hero-conteudo">
            <!-- Foto de Perfil -->
            <div class="foto-perfil-container">
                <img src="foto-perfil.jpg" alt="Vanessa Duran">
            </div>
            
            <h1>Vanessa Duran</h1>
            <p class="subtitulo">Moda • Estilo • Beleza</p>
            
            <div class="botoes-hero">
                <a href="#trabalhos" class="btn btn-dourado">Ver Trabalhos</a>
                <a href="#contato" class="btn btn-transparente">Entrar em Contato</a>
            </div>
        </div>
    </section>

    <!-- Sobre -->
    <section id="sobre">
        <h2 class="secao-titulo">SOBRE MIM</h2>
        <div class="sobre-conteudo">
            <div class="sobre-imagem">
                <img src
