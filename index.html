<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanessa Duran | Couture 3D</title>
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;900&family=Orbitron:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  
  <!-- Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #050508;
      --bg-secondary: #0f0f1a;
      --accent: #ff0080;
      --accent-glow: #ff40aa;
      --silver: #d4d4d4;
      --white: #ffffff;
      --glass: rgba(255, 255, 255, 0.05);
      --border-glow: rgba(255, 0, 128, 0.3);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-primary);
      color: var(--white);
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(255, 0, 128, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(128, 0, 255, 0.06) 0%, transparent 50%);
      background-attachment: fixed;
    }

    /* Barra de rolagem */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { 
      background: linear-gradient(180deg, var(--accent), var(--accent-glow)); 
      border-radius: 4px; 
    }

    /* Navegação */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 9999;
      background: rgba(5, 5, 8, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 0, 128, 0.15);
    }

    .nav-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--silver);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--white);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .cart-icon {
      position: relative;
      font-size: 1.4rem;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .cart-icon:hover {
      transform: scale(1.15);
      color: var(--accent);
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background: var(--accent);
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hero Section 3D */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 10rem 2rem 6rem;
      max-width: 1400px;
      margin: 0 auto;
      gap: 4rem;
      perspective: 1500px;
    }

    .hero-text {
      flex: 1;
      transform-style: preserve-3d;
      animation: floatText 6s ease-in-out infinite;
    }

    @keyframes floatText {
      0%, 100% { transform: translateZ(0) translateY(0); }
      50% { transform: translateZ(20px) translateY(-10px); }
    }

    .hero-badge {
      display: inline-block;
      padding: 0.5rem 1.2rem;
      border: 1px solid var(--accent);
      border-radius: 30px;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
      background: rgba(255, 0, 128, 0.08);
    }

    .hero h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      line-height: 1.05;
      margin-bottom: 1.5rem;
    }

    .hero h1 span {
      background: linear-gradient(90deg, var(--accent), #cc00ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(255, 0, 128, 0.4);
    }

    .hero p {
      font-size: 1.1rem;
      color: #a0a0b0;
      line-height: 1.7;
      margin-bottom: 2.5rem;
      max-width: 500px;
    }

    .hero-buttons {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #cc00ff);
      color: white;
      padding: 1rem 2.2rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(255, 0, 128, 0.4);
      transition: all 0.4s ease;
    }

    .btn-primary:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 40px rgba(255, 0, 128, 0.5);
    }

    .btn-secondary {
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 1rem 2.2rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.4s ease;
      background: transparent;
    }

    .btn-secondary:hover {
      background: rgba(255, 0, 128, 0.1);
      transform: translateY(-4px);
    }

    /* Container da Imagem 3D */
    .hero-3d-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      perspective: 1200px;
    }

    .product-3d-card {
      position: relative;
      width: 420px;
      height: 560px;
      border-radius: 24px;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      cursor: pointer;
    }

    .product-3d-card::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 26px;
      background: linear-gradient(45deg, var(--accent), transparent, #cc00ff);
      opacity: 0.4;
      z-index: -1;
      animation: borderGlow 3s ease-in-out infinite alternate;
    }

    @keyframes borderGlow {
      0% { opacity: 0.3; }
      100% { opacity: 0.6; }
    }

    .product-3d-inner {
      width: 100%;
      height: 100%;
      border-radius: 22px;
      overflow: hidden;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.6),
        0 0 50px rgba(255, 0, 128, 0.15) inset;
    }

    .product-3d-inner img {
      width: 90%;
      height: 90%;
      object-fit: cover;
      border-radius: 16px;
      transition: transform 0.5s ease;
    }

    .product-3d-card:hover .product-3d-inner img {
      transform: scale(1.05);
    }

    .floating-elements {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .floating-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 20px var(--accent);
      animation: floatDot 4s ease-in-out infinite;
    }

    .floating-dot:nth-child(1) { top: 10%; left: -20px; animation-delay: 0s; }
    .floating-dot:nth-child(2) { top: 60%; right: -20px; animation-delay: 1s; background: #cc00ff; box-shadow: 0 0 20px #cc00ff; }
    .floating-dot:nth-child(3) { bottom: 15%; left: 10%; animation-delay: 2s; }

    @keyframes floatDot {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(-20px) scale(1.3); opacity: 1; }
    }

    /* Seção Produtos */
    .section {
      max-width: 1400px;
      margin: 0 auto;
      padding: 6rem 2rem;
    }

    .section-header {
      text-align: center;
      margin-bottom: 4rem;
    }

    .section-tag {
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 0.8rem;
    }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
    }

    .section-title span {
      color: var(--accent);
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--glass);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--silver);
      padding: 0.7rem 1.5rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(255, 0, 128, 0.3);
    }

    /* Grade de Produtos 3D */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2.5rem;
    }

    .product-card-3d {
      perspective: 1000px;
      height: 420px;
    }

    .product-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: var(--bg-secondary);
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
      transition: all 0.5s ease;
      transform-style: preserve-3d;
    }

    .product-card-3d:hover .product-card-inner {
      transform: rotateY(5deg) rotateX(5deg) translateZ(10px);
      border-color: var(--accent);
      box-shadow: 
        -15px 15px 30px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(255, 0, 128, 0.1);
    }

    .product-image-wrapper {
      height: 280px;
      overflow: hidden;
      position: relative;
    }

    .product-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .product-card-3d:hover .product-image-wrapper img {
      transform: scale(1.1);
    }

    .product-badge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: linear-gradient(90deg, var(--accent), #cc00ff);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      z-index: 2;
    }

    .product-info {
      padding: 1.3rem;
    }

    .product-category {
      font-size: 0.75rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .product-name {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
    }

    .product-price {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--white);
      margin-bottom: 1rem;
    }

    .product-actions {
      display: flex;
      gap: 0.8rem;
    }

    .add-cart-btn {
      flex: 1;
      padding: 0.75rem;
      background: rgba(255, 0, 128, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .add-cart-btn:hover {
      background: var(--accent);
      color: white;
      box-shadow: 0 0 15px rgba(255, 0, 128, 0.4);
    }

    .view-btn {
      width: 44px;
      height: 44px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--silver);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .view-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Carrinho Lateral */
    .cart-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .cart-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .cart-panel {
      position: fixed;
      top: 0;
      right: -440px;
      width: 420px;
      max-width: 100%;
      height: 100vh;
      background: var(--bg-secondary);
      border-left: 1px solid rgba(255, 0, 128, 0.2);
      z-index: 10000;
      transition: right 0.4s ease;
      display: flex;
      flex-direction: column;
    }

    .cart-panel.active {
      right: 0;
    }

    .cart-header {
      padding: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header h3 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
    }

    .close-cart {
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--silver);
      transition: color 0.3s ease;
    }

    .close-cart:hover {
      color: var(--accent);
    }

    .cart-items {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.02);
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
    }

    .cart-item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 0.3rem;
    }

    .cart-item-price {
      color: var(--accent);
      font-weight: 900;
    }

    .remove-item {
      color: #ff4444;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .remove-item:hover {
      transform: scale(1.2);
    }

    .cart-footer {
      padding: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 1.2rem;
    }

    .checkout-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(90deg, var(--accent), #cc00ff);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: transform 0.
